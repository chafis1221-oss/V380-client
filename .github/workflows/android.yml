name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: app
        run: gradle assembleDebug

      - name: Build Release APK (unsigned)
        working-directory: app
        run: gradle assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: v380-client-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: v380-client-release-unsigned
          path: app/build/outputs/apk/release/*.apk

      - name: Prepare release APKs
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/v380-client-debug.apk
          cp app/build/outputs/apk/release/*.apk release-assets/v380-client-release-unsigned.apk
          ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: V380 Client Android Build ${{ github.run_number }}
          generate_release_notes: true
          prerelease: true
          files: |
            release-assets/v380-client-debug.apk
            release-assets/v380-client-release-unsigned.apk
